[project]
name = "sre"
version = "1.0.0"
description = "Read-only Kubernetes diagnosis and GitHub PR agent for the homelab"
requires-python = ">=3.12"
dependencies = [
  "hive-core==1.0.0",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=0.3.26,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings[yaml]>=2.7,<3",
  "temporalio>=1.9,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=9,<10",
  "ruff>=0.11,<1",
]

[tool.uv.sources]
hive-core = { path = "../packages/core" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]



[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hive"
version = "1.0.0"
description = "Agent management backend for Hive"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "hive-core==1.0.0",
  "confluent-kafka>=2.8,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-text-splitters>=1.0,<2",
  "openai>=1.100,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings[yaml]>=2.7,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "temporalio>=1.9,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.11,<1",
]

[tool.uv.sources]
hive-core = { path = "../packages/core" }

[tool.setuptools]
package-dir = {"" = "src"}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

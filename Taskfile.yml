version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Set up every project environment
    cmds:
      - task: tools:install
      - task: setup:sre
      - task: setup:pr-review
      - task: setup:hive

  setup:sre:
    desc: Create the SRE virtual environment and install dependencies
    dir: ./sre
    cmds:
      - python3 -m venv --clear .venv
      - .venv/bin/python -m pip install -e ../packages/core
      - .venv/bin/python -m pip install -e ".[dev]"

  setup:pr-review:
    desc: Sync the PR Review environment and development dependencies
    dir: ./pr_review
    cmds:
      - uv sync --locked --extra dev

  setup:hive:
    desc: Create the Hive virtual environment and install dependencies
    dir: ./hive
    cmds:
      - python3 -m venv --clear .venv
      - .venv/bin/python -m pip install -e ../packages/core
      - .venv/bin/python -m pip install -e ".[dev]"
      - npm --prefix ui ci

  tools:install:
    desc: Install the shared pinned CLI tools
    cmds:
      - aqua install

  s3:upload:
    desc: Upload agent prompts and shared knowledge to S3
    cmds:
      - |
        set -eu
        for project in sre pr_review; do
          bash ./scripts/upload-s3.sh "$project"
        done

  database:apply:
    desc: Apply the shared Hive PostgreSQL schema
    cmds:
      - bash ./scripts/apply-sql.sh hive op://homelab/hive/DATABASE_PASSWORD

  rag:index:
    desc: Index changed S3 knowledge documents into Hive PostgreSQL
    dir: ./hive
    cmds:
      - PYTHONPATH="$PWD/../packages/core/src:$PWD/src" .venv/bin/python -m hive.rag.index_cli

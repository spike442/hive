name: PR Review CI/CD

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string

jobs:
  test:
    if: inputs.operation == 'ci' || inputs.operation == 'publish'
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-package
        with:
          package-dir: pr_review
          stage: test

  build:
    if: inputs.operation == 'ci'
    name: build
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-package
        with:
          package-dir: pr_review
          stage: build

  publish:
    if: inputs.operation == 'publish'
    name: publish
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: release
        uses: ./.github/actions/create-module-tag
        with:
          package: pr_review
          tag-prefix: pr-review
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./pr_review/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pr-review:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Core package

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: inputs.operation == 'ci'
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-package
        with:
          package-dir: packages/core
          stage: test
          install-core: "false"

  build:
    if: inputs.operation == 'ci'
    name: Core build
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-package
        with:
          package-dir: packages/core
          stage: build
          install-core: "false"

name: Publish

on:
  workflow_dispatch:
    inputs:
      module:
        description: Package to publish
        required: true
        type: choice
        default: all
        options: [sre, pr_review, hive, all]

permissions:
  contents: write
  packages: write

concurrency:
  group: hive-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sre:
    if: inputs.module == 'sre' || inputs.module == 'all'
    uses: ./.github/workflows/sre.yml
    with:
      operation: publish
    permissions:
      contents: write
      packages: write

  pr_review:
    if: inputs.module == 'pr_review' || inputs.module == 'all'
    uses: ./.github/workflows/pr_review.yml
    with:
      operation: publish
    permissions:
      contents: write
      packages: write

  hive:
    if: inputs.module == 'hive' || inputs.module == 'all'
    uses: ./.github/workflows/hive.yml
    with:
      operation: publish
    permissions:
      contents: write
      packages: write
